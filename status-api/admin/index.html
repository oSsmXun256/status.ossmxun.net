<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>メンテナンス管理</title><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script></head>
<body><main><header><h1>メンテナンス管理</h1><a href="https://status.ossmxun.net">Statusページ</a></header><p id="account" class="muted"></p><p id="message" role="status" aria-live="polite">読み込み中…</p>
<section aria-labelledby="editor-title"><h2 id="editor-title">新規登録</h2><form id="editor"><fieldset id="fields" disabled>
<label>タイトル<input name="title" required maxlength="120"></label><fieldset><legend>対象サービス</legend><div id="services" class="services"></div></fieldset>
<label>理由<textarea name="reason" required maxlength="2000" rows="3"></textarea></label><div class="columns"><label>状態<select name="status"><option value="scheduled">予定</option><option value="in_progress">実施中</option><option value="completed">完了</option></select></label><label>開始日時（日本時間）<input name="startsAt" type="datetime-local"></label><label>終了予定（日本時間）<input name="endsAt" type="datetime-local"></label></div>
<div class="actions"><button type="submit">保存</button><button type="button" id="new-entry" class="secondary">新規登録に戻る</button></div></fieldset></form></section>
<section aria-labelledby="list-title"><div class="section-heading"><h2 id="list-title">登録一覧</h2><button id="reload" class="secondary" type="button">再読み込み</button></div><div id="items"></div></section><footer><a href="/cdn-cgi/access/logout">ログアウト</a></footer></main></body></html>
